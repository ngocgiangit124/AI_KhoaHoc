; THAY BỞI docker-compose.yml (ADR-008, T35): file này giữ làm tham chiếu, KHÔNG dùng khi chạy theo Docker.
; Ánh xạ: numprocs -> deploy.replicas, stopwaitsecs -> stop_grace_period, autorestart -> restart: unless-stopped, user=www-data -> USER của image (10001).
; VitaminVui — Supervisor production/staging (MẪU, T31). Đường dẫn /var/www/backend = bản release hiện hành (symlink).
; Sau mỗi lần deploy: `php artisan queue:restart` (worker thoát sau job hiện tại, Supervisor bật lại bản mã mới)
; và `supervisorctl restart vitaminvui-scheduler:*`.
; Chạy dưới user www-data (KHÔNG root).

; ---- Queue mặc định + exports (T26). Số tiến trình chỉnh theo tải; mỗi worker --max-time để giải phóng bộ nhớ.
[program:vitaminvui-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/backend/artisan queue:work redis --queue=default,exports --tries=3 --sleep=1 --timeout=60 --max-time=3600
directory=/var/www/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=/var/log/vitaminvui/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; ---- Scheduler (T26/T30): MỘT tiến trình mỗi máy. Lệnh đã onOneServer (cần cache Redis dùng chung).
; Dùng schedule:work (chạy mỗi phút, giữ tiến trình). Nếu thích cron: `* * * * * www-data php artisan schedule:run`, bỏ khối này.
[program:vitaminvui-scheduler]
command=php /var/www/backend/artisan schedule:work
directory=/var/www/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/vitaminvui/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; ---- worker-video (T12, ADR-002 §3a.3): CHỈ nên chạy trên máy/container RIÊNG, không chung máy với PHP-FPM.
; Dùng image build sẵn, biến môi trường riêng (infra/production/.env.worker-video.example), KHÔNG có .env của app,
; APP_KEY/APP_ENV riêng, REDIS_PREFIX trùng app, user Redis ACL riêng (infra/production/redis/users.acl), DB user riêng (infra/production/mysql/grants-users.sql).
; retry_after của connection redis_video (3900s) > --timeout (3600s). Nạp env: dùng `environment=KEY="value",...` của Supervisor
; (đặt trong file conf riêng chmod 600 ngoài thư mục mã nguồn, ví dụ /etc/supervisor/conf.d/worker-video-env.conf) hoặc
; `EnvironmentFile=` của systemd với file KHÔNG có chú thích cuối dòng. KHÔNG dùng `env $(cat file | xargs)` (Supervisor không
; chạy shell, và cách đó làm hỏng giá trị có dấu cách/chú thích; ProductionConfigGuard chặn giá trị chứa ` #`).
[program:vitaminvui-worker-video]
command=php /var/www/backend/artisan queue:work redis_video --queue=video --tries=2 --timeout=3600 --sleep=3 --max-time=3600
directory=/var/www/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=3610
redirect_stderr=true
stdout_logfile=/var/log/vitaminvui/worker-video.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
