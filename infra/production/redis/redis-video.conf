# VitaminVui — Redis RIÊNG cho queue `video` (T35-1, R2, ADR-002 §3a.3). Mount vào /usr/local/etc/redis/redis.conf của
# service redis-video; ACL từ users.video-instance.acl. Worker video bị chiếm chỉ chạm được instance này (không có phiên, không có queue default).
bind * -::*
port 6379
protected-mode yes
aclfile /usr/local/etc/redis/users.acl
dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 10
# Chặn script Lua/queue giả làm đầy bộ nhớ của instance này (instance nhỏ). Đầy thì từ chối ghi, không ảnh hưởng Redis chính.
maxmemory 256mb
maxmemory-policy noeviction
loglevel notice
