# VitaminVui — Redis chính (T35-1, ADR-008 §8.3): phiên, cache, queue default/exports, limiter. Mount vào /usr/local/etc/redis/redis.conf.
# Mật khẩu KHÔNG nằm ở đây: user `default` định nghĩa trong users.acl (băm SHA-256, mẫu redis/users.acl).
bind * -::*
port 6379
# Không có cổng publish ra host; mạng `app` là mạng Docker nội bộ của project.
protected-mode yes
aclfile /usr/local/etc/redis/users.acl
dir /data
# AOF để queue/phiên sống sót qua restart; RDB là lớp phụ.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
# Dữ liệu queue/phiên không được bị "evict" âm thầm: đầy bộ nhớ thì lỗi ghi (giám sát), không mất job.
maxmemory-policy noeviction
loglevel notice
