# T35-1 (ADR-008 §8.4): Nginx host nghe 10.231.10.1:8081 (gateway mạng Docker `front`), địa chỉ này chỉ tồn tại khi Docker đã tạo mạng.
# Cài: sudo install -D -m 0644 after-docker.conf /etc/systemd/system/nginx.service.d/after-docker.conf && sudo systemctl daemon-reload
# Phòng hờ thêm: sysctl net.ipv4.ip_nonlocal_bind=1 (cho phép bind địa chỉ chưa tồn tại) trong /etc/sysctl.d/90-vitaminvui.conf.
[Unit]
After=docker.service
Wants=docker.service
