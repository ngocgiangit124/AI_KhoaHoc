# Phần chung cho host api, admin-api (host video chỉ dùng vv-deny.conf + location riêng). Header bảo mật API (HSTS, nosniff, Referrer-Policy, X-Frame-Options)
# do Laravel (App\Http\Middleware\SecurityHeaders) đặt: Nginx KHÔNG thêm để tránh trùng (BUG-1 T01).
server_tokens off;
client_max_body_size 5m;

# V3-1 (security vòng 3): DNS-only, không còn WAF/CDN phía trước, nên Nginx tự chặn flood và kết nối chậm (slowloris) TRƯỚC khi chiếm một worker
# FPM. Zone khai báo ở conf.d/vitaminvui.conf. Ngưỡng tính theo IP, mà lớp học ~40 học sinh có thể chung MỘT IP NAT:
#  - vv_api 50r/s, burst 200 nodelay: lớp 40 máy tải trang/làm bài (vài request/giây mỗi máy lúc cao điểm) vẫn 200; chỉ một nguồn >50 req/s kéo dài
#    (vượt burst 200) mới bị 429. Laravel đã có throttle nghiệp vụ; đây chỉ là chốt chặn flood.
#  - vv_api_auth 10r/s, burst 80 nodelay cho /auth/*: 40 học sinh đăng nhập cùng lúc đầu giờ (một cú dồn ~40-80 request) không bị 429 oan; chống
#    dò mật khẩu/OTP là việc của Laravel (captcha, trần theo tài khoản/IP).
#  - limit_conn 300/IP: 40 trình duyệt x vài kết nối (HTTP/2 thường 1/máy); đủ rộng cho NAT, vẫn chặn một IP mở hàng nghìn kết nối chậm.
#  - timeout ngắn: header 10s, body 15s (khoảng nghỉ giữa hai lần đọc), send 30s, keepalive 30s.
limit_req_status 429;
limit_conn vv_conn 300;
limit_conn_status 429;
client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;
reset_timedout_connection on;

include /etc/nginx/snippets/vv-deny.conf;

location / {
    limit_req zone=vv_api burst=200 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

# Đăng nhập/đăng ký/OTP/quên mật khẩu (học sinh và quản trị): vùng đếm riêng, chặt hơn nhưng đủ rộng cho lớp học đăng nhập cùng lúc.
location ~ ^/api/v1/(admin/)?auth/ {
    limit_req zone=vv_api_auth burst=80 nodelay;
    try_files $uri /index.php?$query_string;
}

# Webhook Bunny (R-1 review T37): bí mật `?k=` nằm trên URL nên access log chỉ ghi `$uri` (log_format vv_noargs, khai báo ở
# conf.d/vitaminvui.conf), khớp CHÍNH XÁC tên nên thắng `^~ /api/v1/webhooks/` bên dưới. Giữ nguyên mọi xử lý khác của webhook:
# 16 KB, xoá header nội bộ SSR, fastcgi. Lưu ý: `error_log` của Nginx vẫn có thể ghi dòng request đầy đủ khi upstream lỗi,
# đặt quyền 0640 cho log và coi token là bí mật vận hành (xoay khi nghi lộ).
location = /api/v1/webhooks/video/bunny {
    access_log /var/log/nginx/vv-webhook.access.log vv_noargs;
    client_max_body_size 16k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php_fpm;
}

# Webhook: 16 KB áp dụng tại Nginx (kể cả chunked). Xoá header nội bộ SSR (T26-3).
location ^~ /api/v1/webhooks/ {
    client_max_body_size 16k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php_fpm;
}

# C4-L2: `/up` (health check JSON tối giản) chỉ cho IP giám sát/load balancer. Thay <IP_MONITOR_LB> bằng IP thật (nhiều
# dòng allow nếu cần); IP khác nhận 403. Dùng `real_ip` đúng (vv-real-ip.conf) để so IP khách thật chứ không phải IP LB.
location = /up {
    allow <IP_MONITOR_LB>;
    deny all;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php_fpm;
}

# `internal`: chỉ nhận chuyển hướng nội bộ từ try_files (đã qua limit_req ở location / hoặc auth); gọi thẳng /index.php từ ngoài trả 404,
# nên không né được limit_req và request chỉ bị đếm một lần.
location = /index.php {
    internal;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    # Host công khai: luôn xoá để khách không giả mạo IP/token. Next.js SSR đi đường riêng: server nội bộ
    # `:8081` trong vitaminvui.conf (chỉ ở đó 2 header này được chuyển tới Laravel).
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php_fpm;
}

location ~ \.php$ { return 404; }
