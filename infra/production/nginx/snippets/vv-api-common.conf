# Phần chung cho host api, admin-api (host video chỉ dùng vv-deny.conf + location riêng). Header bảo mật API (HSTS, nosniff, Referrer-Policy, X-Frame-Options)
# do Laravel (App\Http\Middleware\SecurityHeaders) đặt: Nginx KHÔNG thêm để tránh trùng (BUG-1 T01).
server_tokens off;
client_max_body_size 5m;

include /etc/nginx/snippets/vv-deny.conf;

location / { try_files $uri $uri/ /index.php?$query_string; }

# Webhook Bunny (R-1 review T37): bí mật `?k=` nằm trên URL nên access log chỉ ghi `$uri` (log_format vv_noargs, khai báo ở
# conf.d/vitaminvui.conf), khớp CHÍNH XÁC tên nên thắng `^~ /api/v1/webhooks/` bên dưới. Giữ nguyên mọi xử lý khác của webhook:
# 16 KB, xoá header nội bộ SSR, fastcgi. Lưu ý: `error_log` của Nginx vẫn có thể ghi dòng request đầy đủ khi upstream lỗi,
# đặt quyền 0640 cho log và coi token là bí mật vận hành (xoay khi nghi lộ).
location = /api/v1/webhooks/video/bunny {
    access_log /var/log/nginx/vv-webhook.access.log vv_noargs;
    client_max_body_size 16k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php_fpm;
}

# Webhook: 16 KB áp dụng tại Nginx (kể cả chunked). Xoá header nội bộ SSR (T26-3).
location ^~ /api/v1/webhooks/ {
    client_max_body_size 16k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php_fpm;
}

# C4-L2: `/up` (health check JSON tối giản) chỉ cho IP giám sát/load balancer. Thay <IP_MONITOR_LB> bằng IP thật (nhiều
# dòng allow nếu cần); IP khác nhận 403. Dùng `real_ip` đúng (vv-real-ip.conf) để so IP khách thật chứ không phải IP LB.
location = /up {
    allow <IP_MONITOR_LB>;
    deny all;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php_fpm;
}

location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    # Host công khai: luôn xoá để khách không giả mạo IP/token. Next.js SSR đi đường riêng: server nội bộ
    # `:8081` trong vitaminvui.conf (chỉ ở đó 2 header này được chuyển tới Laravel).
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php_fpm;
}

location ~ \.php$ { return 404; }
