# IP khách thật (T35-1, quyết định PO 2026-10-10: TẠM BỎ Cloudflare proxy, DNS trỏ thẳng server, Nginx host là lớp ngoài cùng).
# Không có proxy/CDN phía trước: IP thật là `$remote_addr` (địa chỉ kết nối TCP). File này CỐ Ý không có `set_real_ip_from` và không tin bất kỳ header
# nào (CF-Connecting-IP, X-Forwarded-For): khách tự đặt được header, tin header là cho họ giả IP để né throttle theo IP, captcha, allow-list.
# Mọi `server` vẫn `include` file này để khi bật proxy sau chỉ cần thay nội dung file (mẫu: vv-real-ip.cloudflare.conf), không sửa conf.d.
# Nginx truyền `$remote_addr` cho Laravel qua fastcgi_params (REMOTE_ADDR); app chỉ tin proxy trong TRUSTED_PROXIES (dải mạng Docker nội bộ).
