# Nginx đứng sau load balancer/CDN: lấy IP khách thật để (1) allow-list /videolab/library/ không bị lách,
# (2) token CDN VideoLab ràng IP đúng, (3) throttle theo IP đúng. Điền ĐÚNG IP/dải của LB, không dùng 0.0.0.0/0.
# Nếu Nginx lộ trực tiếp ra Internet (không LB): bỏ file này, `$remote_addr` đã là IP khách.
set_real_ip_from <IP_LOAD_BALANCER_1>;
# set_real_ip_from <IP_LOAD_BALANCER_2>;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
