# Có Cloudflare proxy đứng trước Nginx (ADR-008 "Quyết định PO 2026-10-09"): lấy IP khách thật từ `CF-Connecting-IP` để
# (1) bộ đếm đăng nhập sai theo IP (GL-A2) và throttle theo IP không gom mọi người về vài IP edge của Cloudflare,
# (2) allow-list /videolab/library/ và token CDN VideoLab ràng IP đúng, (3) `remoteip` gửi Turnstile đúng.
# Chỉ tin header khi kết nối đến TỪ dải IP Cloudflare dưới đây. KHÔNG dùng 0.0.0.0/0. Firewall origin chỉ mở 80/443 cho
# đúng các dải này (nếu không, kẻ bên ngoài tự đặt CF-Connecting-IP để giả IP, né trần theo IP).
# Danh sách dải do `scripts/update-cloudflare-ips.sh` sinh từ https://www.cloudflare.com/ips-v4 và ips-v6: chạy định kỳ
# (cron hàng tuần) rồi `nginx -t && nginx -s reload`. Bản dưới là dải hiện hành lúc viết (2026-10-09).
# Nếu KHÔNG dùng Cloudflare (Nginx lộ trực tiếp hoặc sau LB khác): thay bằng `set_real_ip_from <IP LB>` +
# `real_ip_header X-Forwarded-For;` và sửa lại checklist.

# --- BEGIN cloudflare-ips (sinh bởi update-cloudflare-ips.sh) ---
# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
