# Chặn file nhạy cảm và PATH_INFO qua front controller (dùng chung cho host API và host video).
# ADR-004 §6 — chặn file nhạy cảm.
location ~ /\.(?!well-known).* { deny all; }
location ~* ^/(\.env|\.git|storage/) { deny all; }

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

# M2 — chặn PATH_INFO qua front controller.
location ^~ /index.php/ { return 404; }

