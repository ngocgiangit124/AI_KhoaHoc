# TUỲ CHỌN (PO 2026-10-11): host static làm ORIGIN cho pull zone Bunny khi chưa có tên miền tĩnh riêng (một tên miền).
# Trình duyệt dùng STATIC_URL=https://<pull-zone>.b-cdn.net (khác site, guard US-020 chấp nhận); Bunny lấy file từ
# static.<domain> và gửi header bí mật X-VV-Origin (Edge Rule "Set Request Header", Request URL = *). Ai gọi thẳng origin
# không có header thì 403, nên người dùng không mở được file trên site chung với app.
# Cài: thay <SECRET_ORIGIN> bằng `openssl rand -hex 24`, chmod 0640 root:nginx, include trong server static (sau server_name).
# Không phải secret mức cao: lộ thì chỉ đọc được file vốn công khai. Đổi: sửa Edge Rule trước, rồi file này, `nginx -s reload`.
if ($http_x_vv_origin != "<SECRET_ORIGIN>") { return 403; }
