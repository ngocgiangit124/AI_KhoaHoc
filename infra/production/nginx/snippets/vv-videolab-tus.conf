# TUS (dùng cho `= /videolab/tus` và `^~ /videolab/tus/`). Mỗi PATCH ≤ VIDEOLAB_CHUNK_MAX_MB (8) + 1 MB dư.
limit_req zone=vv_tus burst=40 nodelay;
limit_req_status 429;   # tus-js-client coi 429 là thử lại
client_max_body_size 9m;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param HTTP_PROXY "";
fastcgi_param HTTP_X_INTERNAL_TOKEN "";
fastcgi_param HTTP_X_CLIENT_IP "";
fastcgi_pass php_fpm;
