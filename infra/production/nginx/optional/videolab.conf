# VitaminVui — Nginx host `video.` của VideoLab (TUS upload + phát HLS). TUỲ CHỌN, KHÔNG nạp mặc định (T35-1, quyết định PO 2026-10-10: V1 dùng Bunny,
# production KHÔNG mở host `video.`). Chỉ dùng khi bật VideoLab (VV_VIDEOLAB=1, VIDEO_PROVIDER=internal): copy vào /etc/nginx/conf.d/, thêm
# `video.<domain>` vào server_name của server :80 trong vitaminvui.conf, tạo chứng chỉ cho host này, và xem README mục 12 (host này đi qua
# Cloudflare nào (DNS-only như các host khác ở V1; nếu sau này bật proxy thì giới hạn upload 100 MB của gói Free).
# Giới hạn tốc độ (T12-4). Khoá theo IP khách thật (cần vv-real-ip.conf nếu sau LB).
limit_req_zone $binary_remote_addr zone=vv_cdn:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=vv_tus:10m rate=20r/s;

# --- VideoLab (ADR-002 §3a). Chỉ /videolab/tus* và /videolab/cdn/* mở cho Internet.
server {
    listen 443 ssl;
    http2 on;
    server_name video.vitaminvui.vn;
    root /var/www/backend/public;
    index index.php;
    ssl_certificate     /etc/ssl/vitaminvui/fullchain.pem;
    ssl_certificate_key /etc/ssl/vitaminvui/privkey.pem;
    include /etc/nginx/snippets/vv-tls.conf;
    include /etc/nginx/snippets/vv-real-ip.conf;
    server_tokens off;
    include /etc/nginx/snippets/vv-deny.conf;
    client_max_body_size 1k;

    # BUG-2 (QA T31): mọi đường dẫn không khai báo bên dưới (kể cả `/`, `/index.php`, `/videolab/tusXYZ`) trả 404 tại Nginx,
    # không phụ thuộc Route::domain của Laravel. Chỉ `/videolab/tus`, `/videolab/tus/*`, `/videolab/cdn/*`, `/videolab/library/*` vào PHP.
    location / { return 404; }


    # T12-5: /videolab/library/* CHỈ app server gọi vào (App -> VideoLab). Thay bằng IP app server CỤ THỂ.
    # Không để dải private rộng như local. Cần real_ip đúng (vv-real-ip.conf) để allow/deny so IP thật.
    location ^~ /videolab/library/ {
        allow <IP_APP_SERVER>;
        # allow 127.0.0.1;   # chỉ khi app gọi qua loopback trên cùng máy
        deny all;
        client_max_body_size 16k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_INTERNAL_TOKEN "";
        fastcgi_param HTTP_X_CLIENT_IP "";
        fastcgi_pass php_fpm;
    }

    # TUS khớp đúng route thật: POST/OPTIONS `/videolab/tus` và HEAD/PATCH/OPTIONS `/videolab/tus/{guid}`.
    location = /videolab/tus      { include /etc/nginx/snippets/vv-videolab-tus.conf; }
    location ^~ /videolab/tus/    { include /etc/nginx/snippets/vv-videolab-tus.conf; }

    # Phát HLS: Laravel kiểm token rồi trả X-Accel-Redirect (VIDEOLAB_ACCEL_REDIRECT=true) tới /_protected_hls/.
    # limit_req (T12-4): một player tải playlist + segment liên tục, burst đủ rộng; chỉnh sau khi đo staging.
    location ^~ /videolab/cdn/ {
        limit_req zone=vv_cdn burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_INTERNAL_TOKEN "";
        fastcgi_param HTTP_X_CLIENT_IP "";
        fastcgi_pass php_fpm;
    }

    # Đường dẫn phải khớp VIDEOLAB_PATH (mặc định storage/app/videolab) + /hls/. Chỉ truy cập được qua X-Accel-Redirect.
    location /_protected_hls/ {
        internal;
        alias /var/www/backend/storage/app/videolab/hls/;
    }

}
