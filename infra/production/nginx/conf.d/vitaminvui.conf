# VitaminVui — Nginx production/staging (MẪU, T31). Thay vitaminvui.vn / vitaminvui-media.net bằng tên miền thật.
# Staging dùng tên miền RIÊNG (vitaminvui-staging.vn, vitaminvui-staging-media.net), KHÔNG dùng subdomain của production
# (ADR-004 §2.1): cookie host-only, nhưng tách tên miền để staging không đọc/ghi được gì của production.
#
# 4 host ứng dụng + VideoLab + tên miền tĩnh:
#   vitaminvui.vn            web học sinh (Next.js, proxy)
#   admin.vitaminvui.vn      admin (Next.js, proxy)
#   api.vitaminvui.vn        API học sinh + webhook (Laravel)
#   admin-api.vitaminvui.vn  API quản trị (Laravel)
#   video.vitaminvui.vn      VideoLab (TUS + phát HLS): TUỲ CHỌN, tách ra optional/videolab.conf, V1 không mở (Bunny)
#   static.vitaminvui-media.net  file người dùng tải lên (tên miền đăng ký riêng, KHÔNG cookie)

upstream php_fpm   { server 127.0.0.1:9000; keepalive 16; }   # hoặc unix socket / service php-fpm
upstream next_web   { server 127.0.0.1:3000; keepalive 16; }
upstream next_admin { server 127.0.0.1:3001; keepalive 16; }

# Host web công khai (ADR-004 §2.8): chống cào HTML/RSC theo IP khách thật. Giá trị KHỞI ĐIỂM, chỉnh sau khi đo staging
# (lớp học chung NAT ~40 máy, mỗi trang kéo theo prefetch) và xem log 429.
# API (V3-1): xem lý do ngưỡng trong snippets/vv-api-common.conf. Khoá theo IP khách thật ($remote_addr, DNS-only).
limit_req_zone  $binary_remote_addr zone=vv_api:10m      rate=50r/s;
limit_req_zone  $binary_remote_addr zone=vv_api_auth:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=vv_conn:10m;
limit_req_zone $binary_remote_addr zone=vv_web:10m rate=10r/s;
# Host admin (GL-1/RL-2): ít người dùng, nên chặt hơn host web. Giá trị KHỞI ĐIỂM, chỉnh sau khi đo staging.
limit_req_zone $binary_remote_addr zone=vv_admin:10m rate=5r/s;

# Log KHÔNG chứa query (R-1 review T37): webhook Bunny mang bí mật `?k=<BUNNY_WEBHOOK_TOKEN>` trên URL; `$request`/`$args`/`$request_uri`
# sẽ ghi bí mật đó vào access log. Chỉ dùng `$uri` (đã bỏ query). Dùng cho `location = /api/v1/webhooks/video/bunny` (vv-api-common.conf)
# và cho `location = /phu-huynh/huy-nhan-thong-bao` ở host web (GL-1/D1: link huỷ nhận thư phụ huynh mang `?t=<token HMAC>`).
log_format vv_noargs '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

# --- Host lạ / truy cập bằng IP: đóng kết nối (L3). Cũng phủ HTTPS để IP:443 không lộ chứng chỉ của host thật.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/ssl/vitaminvui/default.crt;   # chứng chỉ tự ký/riêng, không phải của host thật
    ssl_certificate_key /etc/ssl/vitaminvui/default.key;
    server_tokens off;
    return 444;
}

# --- HTTP -> HTTPS cho mọi host thật
server {
    listen 80;
    server_name vitaminvui.vn admin.vitaminvui.vn api.vitaminvui.vn admin-api.vitaminvui.vn static.vitaminvui-media.net;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

# --- API học sinh
server {
    listen 443 ssl;
    http2 on;
    server_name api.vitaminvui.vn;
    root /var/www/backend/public;
    index index.php;
    ssl_certificate     /etc/ssl/vitaminvui/fullchain.pem;
    ssl_certificate_key /etc/ssl/vitaminvui/privkey.pem;
    include /etc/nginx/snippets/vv-tls.conf;
    include /etc/nginx/snippets/vv-real-ip.conf;
    include /etc/nginx/snippets/vv-api-common.conf;
}

# --- API quản trị. Khuyến nghị: giới hạn theo IP văn phòng/VPN nếu PO đồng ý (bỏ comment).
server {
    listen 443 ssl;
    http2 on;
    server_name admin-api.vitaminvui.vn;
    root /var/www/backend/public;
    index index.php;
    ssl_certificate     /etc/ssl/vitaminvui/fullchain.pem;
    ssl_certificate_key /etc/ssl/vitaminvui/privkey.pem;
    include /etc/nginx/snippets/vv-tls.conf;
    include /etc/nginx/snippets/vv-real-ip.conf;
    # allow <IP_VAN_PHONG>; deny all;
    include /etc/nginx/snippets/vv-api-common.conf;
}

# --- Đường NỘI BỘ cho Next.js SSR (T26/BUG-1 QA T31). Throttle `catalog` cần `X-Internal-Token` + `X-Client-IP` tới được
# Laravel; mọi host công khai xoá 2 header này nên SSR phải gọi vào listener riêng này:
#   - chỉ nghe IP mạng nội bộ (đổi <IP_NOI_BO_NGINX>), HTTP thường, KHÔNG mở ra Internet/firewall chặn 8081 từ ngoài;
#   - allow đúng IP Next server, deny all; chỉ GET/HEAD tới /api/v1/ (catalog công khai);
#   - SSR đặt API_INTERNAL_URL=http://<IP_NOI_BO_NGINX>:8081. Host do Nginx ÉP bên dưới (fastcgi_param HTTP_HOST) vì Node/undici
#     không đặt được header Host; Laravel nhờ đó định tuyến đúng theo Route::domain (ADR-004 §2.8).
#   - SSR gửi `X-Internal-Token: $INTERNAL_API_TOKEN` (mọi request) và `X-Client-IP: <IP khách thật>` (chỉ truy vấn có `q`;
#     thiếu IP thì chỉ tính trần tổng CATALOG_SSR_TOTAL_PER_MINUTE). Token KHÔNG đưa xuống trình duyệt.
# Chỉ bật INTERNAL_API_REQUIRED=true sau khi FE đã gửi header token.
server {
    listen <IP_NOI_BO_NGINX>:8081;
    server_name api.vitaminvui.vn;
    root /var/www/backend/public;
    server_tokens off;
    allow <IP_NEXT_SERVER>;
    deny all;
    client_max_body_size 1k;
    # Log riêng để đếm 429/5xx của nguồn SSR.
    access_log /var/log/nginx/vv-internal.access.log;

    location / { return 404; }

    location ^~ /api/v1/ {
        limit_except GET HEAD { deny all; }
        include fastcgi_params;
        fastcgi_param HTTP_HOST api.vitaminvui.vn;   # ép Host = host api, bất kể Next gọi bằng IP
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        # KHÔNG xoá HTTP_X_INTERNAL_TOKEN / HTTP_X_CLIENT_IP ở đây (fastcgi_params chuyển header client nguyên vẹn).
        fastcgi_pass php_fpm;
    }
}

# --- VideoLab (host `video.`): KHÔNG nằm trong file này. V1 dùng Bunny (quyết định PO 2026-10-10, ADR-008): không mở host `video.`.
#     Chỉ khi bật VideoLab (VV_VIDEOLAB=1) mới copy nginx/optional/videolab.conf vào conf.d (README mục 12).

# --- Tên miền tĩnh (S2): không cookie, không PHP, chỉ đọc. Disk `uploads` (UPLOADS_PATH) nằm NGOÀI storage/app/public.
server {
    listen 443 ssl;
    http2 on;
    server_name static.vitaminvui-media.net;
    root /var/www/uploads;                 # = UPLOADS_PATH
    ssl_certificate     /etc/ssl/vitaminvui-media/fullchain.pem;
    ssl_certificate_key /etc/ssl/vitaminvui-media/privkey.pem;
    include /etc/nginx/snippets/vv-tls.conf;
    server_tokens off;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        autoindex off;
        # ADR-004 §6: nếu thêm add_header trong location này, phải lặp lại cả 3 header (add_header không kế thừa).
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=86400" always;
        # US-020 (M1): ảnh chân dung giáo viên là dữ liệu cá nhân, không để công cụ tìm kiếm lập chỉ mục trang/ảnh. Rút đồng ý
        # thì ứng dụng đổi tên file (URL cũ trả 404), nhưng bản đã vào chỉ mục/CDN cũ phải tự hết hạn.
        add_header X-Robots-Tag "noindex, noimageindex" always;
        # Không bao giờ set cookie ở host này.
        proxy_hide_header Set-Cookie;
    }
    location ~ /\. { deny all; }
}

# --- Web học sinh (Next.js). Next tự đặt CSP có nonce + header bảo mật; Nginx chỉ proxy.
server {
    listen 443 ssl;
    http2 on;
    server_name vitaminvui.vn;
    ssl_certificate     /etc/ssl/vitaminvui/fullchain.pem;
    ssl_certificate_key /etc/ssl/vitaminvui/privkey.pem;
    include /etc/nginx/snippets/vv-tls.conf;
    include /etc/nginx/snippets/vv-real-ip.conf;
    server_tokens off;

    # Tài nguyên tĩnh có hash: không giới hạn tốc độ.
    location ^~ /_next/static/ {
        proxy_pass http://next_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;      # ghi đè, không nối chuỗi do khách gửi
        # Header nội bộ chỉ Next server tự gửi tới API qua mạng nội bộ; không bao giờ nhận từ khách.
        proxy_set_header X-Internal-Token "";
        proxy_set_header X-Client-IP "";
        # V3-3: chuẩn hoá header khách tự gửi, không để lọt tới Next (Next dùng x-forwarded-host dựng URL/kiểm Origin; x-real-ip là fallback).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
    }

    # GL-1 (D1): trang huỷ nhận thông báo của phụ huynh nhận token trên query `?t=<token>` (link trong thư). Access log của
    # host này CHỈ ghi `$uri` (không query) để token không nằm trong log. Token cũng KHÔNG được vào log của Next.js/LB/CDN
    # (xem docs/ops/production-checklist.md §3). LƯU Ý: `error_log` của Nginx vẫn ghi `request: "GET /...?t=..."` khi upstream lỗi
    # (không che được bằng cấu hình) — giữ error_log ở mức error/warn, hạn chế truy cập và xoay vòng log ngắn.
    # API nhận token (POST /api/v1/parent-notices/unsubscribe) gửi token trong body JSON nên access_log mặc định không chứa nó.
    location = /phu-huynh/huy-nhan-thong-bao {
        access_log /var/log/nginx/vv-web-noargs.access.log vv_noargs;
        limit_req zone=vv_web burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://next_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Internal-Token "";
        proxy_set_header X-Client-IP "";
        # V3-3: chuẩn hoá header khách tự gửi, không để lọt tới Next (Next dùng x-forwarded-host dựng URL/kiểm Origin; x-real-ip là fallback).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
    }

    location / {
        limit_req zone=vv_web burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://next_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;      # ghi đè, không nối chuỗi do khách gửi
        # Header nội bộ chỉ Next server tự gửi tới API qua mạng nội bộ; không bao giờ nhận từ khách.
        proxy_set_header X-Internal-Token "";
        proxy_set_header X-Client-IP "";
        # V3-3: chuẩn hoá header khách tự gửi, không để lọt tới Next (Next dùng x-forwarded-host dựng URL/kiểm Origin; x-real-ip là fallback).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
    }
}

# --- Admin (Next.js)
server {
    listen 443 ssl;
    http2 on;
    server_name admin.vitaminvui.vn;
    ssl_certificate     /etc/ssl/vitaminvui/fullchain.pem;
    ssl_certificate_key /etc/ssl/vitaminvui/privkey.pem;
    include /etc/nginx/snippets/vv-tls.conf;
    include /etc/nginx/snippets/vv-real-ip.conf;
    server_tokens off;
    # allow <IP_VAN_PHONG>; deny all;

    # Tài nguyên tĩnh có hash: không giới hạn tốc độ (như host web); một lần tải trang kéo hàng chục chunk.
    location ^~ /_next/static/ {
        proxy_pass http://next_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Internal-Token "";
        proxy_set_header X-Client-IP "";
        # V3-3: chuẩn hoá header khách tự gửi, không để lọt tới Next (Next dùng x-forwarded-host dựng URL/kiểm Origin; x-real-ip là fallback).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
    }

    location / {
        limit_req zone=vv_admin burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://next_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Internal-Token "";
        proxy_set_header X-Client-IP "";
        # V3-3: chuẩn hoá header khách tự gửi, không để lọt tới Next (Next dùng x-forwarded-host dựng URL/kiểm Origin; x-real-ip là fallback).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
    }
}
