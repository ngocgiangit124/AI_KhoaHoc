# VitaminVui — Nginx local (T01)
# 3 host: api.localhost (học sinh + webhook), admin-api.localhost (quản trị),
# video.localhost (VideoLab, chưa có route trước T12 — cùng public/ theo tasks.md T01).

# L3 (review bảo mật T01/T02) — Host lạ (không khớp server_name nào bên dưới)
# bị đóng kết nối ngay tại Nginx, không phụ thuộc hoàn toàn vào TrustHosts của
# Laravel (lớp phòng thủ thứ 2 — Laravel vẫn giữ TrustHosts vì Nginx tương lai
# có thể đổi/thêm host mà quên cập nhật ở đây).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    server_name api.localhost;
    root /var/www/backend/public;
    index index.php;

    include /etc/nginx/snippets/vv-common.conf;
}

server {
    listen 80;
    server_name admin-api.localhost;
    root /var/www/backend/public;
    index index.php;

    include /etc/nginx/snippets/vv-common.conf;
}

server {
    listen 80;
    server_name video.localhost;
    root /var/www/backend/public;
    index index.php;

    include /etc/nginx/snippets/vv-common.conf;
}
