# VitaminVui — Nginx local (T01)
# 3 host: api.localhost (học sinh + webhook), admin-api.localhost (quản trị),
# video.localhost (VideoLab, chưa có route trước T12 — cùng public/ theo tasks.md T01).

# L3 (review bảo mật T01/T02) — Host lạ (không khớp server_name nào bên dưới)
# bị đóng kết nối ngay tại Nginx, không phụ thuộc hoàn toàn vào TrustHosts của
# Laravel (lớp phòng thủ thứ 2 — Laravel vẫn giữ TrustHosts vì Nginx tương lai
# có thể đổi/thêm host mà quên cập nhật ở đây).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    server_name api.localhost;
    root /var/www/backend/public;
    index index.php;

    include /etc/nginx/snippets/vv-common.conf;
}

server {
    listen 80;
    server_name admin-api.localhost;
    root /var/www/backend/public;
    index index.php;

    include /etc/nginx/snippets/vv-common.conf;
}

server {
    listen 80;
    server_name video.localhost;
    root /var/www/backend/public;
    index index.php;

    include /etc/nginx/snippets/vv-common.conf;

    # T12 (ADR-002 §3a) — chỉ /videolab/tus*, /videolab/cdn/* mở cho trình duyệt; /videolab/library/* chỉ mạng nội bộ.
    # Local: mọi request từ trình duyệt đi qua cổng publish của Docker nên Nginx thấy IP gateway thuộc dải private,
    # do đó allow-list này KHÔNG chặn được máy host ở local (chỉ có tác dụng khi Nginx đứng trước Internet).
    # Production: thay bằng IP app server cụ thể.
    location ^~ /videolab/library/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        client_max_body_size 16k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }

    # TUS: mỗi PATCH tối đa videolab.chunk_max_mb (8 MB) — frontend đặt chunkSize ≤ 8 MB; dư 1 MB cho overhead.
    location ^~ /videolab/tus {
        client_max_body_size 9m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }

    # Phát HLS: Laravel kiểm token rồi trả X-Accel-Redirect (bật VIDEOLAB_ACCEL_REDIRECT=true) tới đây.
    location ^~ /videolab/cdn/ {
        client_max_body_size 1k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }

    location /_protected_hls/ {
        internal;
        alias /var/www/backend/storage/app/videolab/hls/;
    }

    # Mọi đường dẫn khác trên host video: không có gì để phục vụ.
    location ~ ^/videolab/(?!tus|cdn/|library/) {
        return 404;
    }
}
