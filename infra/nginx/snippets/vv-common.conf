# Chặn truy cập trực tiếp file nhạy cảm (ADR-004 §6)
location ~ /\.(?!well-known).* {
    deny all;
}

location ~* ^/(\.env|\.git|storage/) {
    deny all;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

# L3 (review bảo mật T01/T02) — không lộ phiên bản Nginx.
server_tokens off;

# BUG-1 (QA T01/T02): header bảo mật CHỈ đặt ở Laravel (App\Http\Middleware\
# SecurityHeaders — còn có logic điều kiện HSTS theo isSecure()); Nginx KHÔNG
# tự thêm nữa để tránh trùng 2 lần trên mọi response.

client_max_body_size 5m;

# M2 (review bảo mật T01/T02) — chặn PATH_INFO qua front controller: nếu
# không, `/index.php/storage/x` hay `/index.php/api/v1/webhooks/...` vượt qua
# được mọi location chặn phía trên/dưới vì chúng không khớp tiền tố tương ứng,
# nhưng Laravel vẫn định tuyến được theo PATH_INFO.
location ^~ /index.php/ {
    return 404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Giới hạn 16 KB áp dụng NGAY TẠI ĐÂY (Nginx đọc body trước khi chuyển cho
# FPM) — kể cả khi client gửi `Transfer-Encoding: chunked` (không có
# Content-Length). Khác với để `try_files` chuyển hướng nội bộ sang
# `location ~ \.php$` (không giới hạn kích thước riêng), khiến webhook nhận
# được body lớn hơn 16 KB (M2).
location ^~ /api/v1/webhooks/ {
    client_max_body_size 16k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    # T26 (M3): header nội bộ SSR không bao giờ đi qua host công khai.
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php:9000;
}

# Chỉ ĐÚNG `/index.php` (front controller thật) được chạy PHP.
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    # T26 (M3): header nội bộ SSR không bao giờ đi qua host công khai.
    fastcgi_param HTTP_X_INTERNAL_TOKEN "";
    fastcgi_param HTTP_X_CLIENT_IP "";
    fastcgi_pass php:9000;
}

# Mọi file .php khác (kể cả không tồn tại) → 404 ngay tại Nginx, không chuyển
# cho FPM (M2) — phòng trường hợp có file .php khác lọt lên disk sau này.
location ~ \.php$ {
    return 404;
}
