; VitaminVui PHP overrides (T01). Dùng cho cả image local và image production (C4-L3: nền là php.ini-production).
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
expose_php = Off
; S21: stack trace không mang đối số hàm (tránh rò mã OTP/mật khẩu vào log).
zend.exception_ignore_args = On
; C4-L3: ghi cứng để image nào cũng không in lỗi PHP ra response; debug local bật qua infra/docker-compose.debug.yml.
display_errors = Off
display_startup_errors = Off
log_errors = On
