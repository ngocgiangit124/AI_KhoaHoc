; T35-1 (ADR-008 §8.8). Nạp sau zz-docker.conf của image gốc (thứ tự chữ cái: zz-docker < zz-fpm), nên ghi đè được.
; Giữ clear_env=no của image gốc: biến môi trường của container (env_file) là nguồn cấu hình duy nhất, không có file .env.
[www]
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE}
pm.max_spare_servers = ${FPM_MAX_SPARE}
pm.max_requests = 500
ping.path = /fpm-ping
ping.response = pong
; Access log KHÔNG chứa query string (%r = URI không query): token `?t=`, `?k=` (webhook Bunny, link huỷ nhận thư) không vào log container.
access.format = "%R - [%t] \"%m %r\" %s %{mili}d ms %{kilo}M KB"
; Healthcheck gọi /fpm-ping mỗi 10 giây: không ghi vào access log.
access.suppress_path[] = /fpm-ping
