; T35-1 (ADR-008 §8.8): image bất biến, không đổi file sau khi build => không cần kiểm timestamp.
opcache.enable=1
; CLI (queue, scheduler, artisan) khởi động nguội mỗi lần, bật opcache chỉ tốn bộ nhớ.
opcache.enable_cli=0
opcache.validate_timestamps=0
; Giá trị theo env OPCACHE_MEMORY (large 192, small 64; ini hỗ trợ ${VAR:-mặc định}).
opcache.memory_consumption=${OPCACHE_MEMORY:-192}
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
