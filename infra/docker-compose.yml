name: vitaminvui

# Hạ tầng local T01 — chỉ backend Laravel (agent nextjs-dev chạy frontend/ riêng
# bằng pnpm, KHÔNG cấu hình ở đây; chỉ ghi chú placeholder nếu cần sau này).

services:
  php:
    build:
      context: ./php
      args:
        UID: ${VV_UID:-1000}
        GID: ${VV_GID:-1000}
    image: vitaminvui-php:8.3
    working_dir: /var/www/backend
    environment:
      HOME: /tmp
    volumes:
      - ../backend:/var/www/backend
    env_file:
      - ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vitaminvui

  nginx:
    image: nginx:1.27
    depends_on:
      - php
    volumes:
      - ../backend:/var/www/backend:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    ports:
      # ADR-004 §2.1 (local): http://api.localhost:8000, http://admin-api.localhost:8000.
      # N3 (review bảo mật T01/T02, xác minh lại) — chỉ bind loopback (giống
      # MySQL/Redis/Mailpit ở M6): không mở ra mạng LAN/Wi-Fi trong khi
      # APP_DEBUG=true ở local. Đã KIỂM CHỨNG THẬT (không chỉ suy đoán): từ 1
      # container Docker Desktop độc lập (bridge network riêng, mô phỏng đúng
      # container `web`/`admin` của nextjs-dev trong frontend/docker-compose.yml),
      # gọi `http://host.docker.internal:8000` khi nginx chỉ bind
      # `127.0.0.1:8000` VẪN trả 200 — cả khi có và không có `--add-host`
      # tường minh (Docker Desktop tự cấp DNS `host.docker.internal`). Không
      # cần giữ `0.0.0.0`.
      - "127.0.0.1:8000:80"
      # Tên miền tĩnh local (STATIC_URL): ảnh người dùng tải lên (disk `uploads`).
      - "127.0.0.1:8080:8080"
    networks:
      - vitaminvui

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      # L2: migration tạo trigger chặn sửa/xoá audit_logs; user app không có SUPER nên cần cờ này khi binlog bật.
      - --log-bin-trust-function-creators=1
    environment:
      # M6 (review bảo mật T01/T02) — KHÔNG còn giá trị mặc định "secret": phải
      # đặt trong infra/.env (copy từ infra/.env.example, không commit — đã có
      # trong .gitignore). Thiếu biến → docker compose báo lỗi rõ ràng thay vì
      # âm thầm dùng mật khẩu yếu, cố định, ai đọc code cũng biết.
      MYSQL_ROOT_PASSWORD: ${VV_DB_ROOT_PASSWORD:?Thiếu VV_DB_ROOT_PASSWORD — copy infra/.env.example thành infra/.env và đặt giá trị}
      MYSQL_DATABASE: ${VV_DB_DATABASE:-vitaminvui}
      MYSQL_USER: ${VV_DB_USERNAME:-vitaminvui}
      MYSQL_PASSWORD: ${VV_DB_PASSWORD:?Thiếu VV_DB_PASSWORD — copy infra/.env.example thành infra/.env và đặt giá trị (phải khớp DB_PASSWORD trong backend/.env)}
    volumes:
      - vitaminvui-mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      # M6 — chỉ bind loopback: không mở MySQL ra mạng LAN/Wi-Fi.
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${VV_DB_ROOT_PASSWORD:?}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - vitaminvui
      - internal

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${VV_REDIS_PASSWORD:?Thiếu VV_REDIS_PASSWORD — copy infra/.env.example thành infra/.env và đặt giá trị (phải khớp REDIS_PASSWORD trong backend/.env)}"]
    volumes:
      - vitaminvui-redis:/data
    ports:
      # M6 — chỉ bind loopback: không mở Redis ra mạng LAN/Wi-Fi.
      - "127.0.0.1:6379:6379"
    networks:
      - vitaminvui
      - internal

  mailpit:
    image: axllent/mailpit:latest
    ports:
      # M6 — Mailpit không có xác thực và chứa email OTP/PII khi test; chỉ bind loopback.
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - vitaminvui

  queue:
    image: vitaminvui-php:8.3
    working_dir: /var/www/backend
    environment:
      HOME: /tmp
    command: ["php", "artisan", "queue:work", "--queue=default,exports", "--tries=3", "--sleep=1", "--timeout=60", "--max-time=3600"]
    # Worker tự thoát khi một job quá thời gian ("Job timed out") — cần tự khởi động lại.
    restart: unless-stopped
    volumes:
      - ../backend:/var/www/backend
    env_file:
      - ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vitaminvui

  # T12 — worker transcode VideoLab (queue `video`, ffmpeg). Sandbox theo ADR-002 §3a.3:
  # non-root, rootfs chỉ đọc, KHÔNG env_file/.env (ghi đè bằng /dev/null), chỉ mạng `internal`
  # (MySQL/Redis), chỉ ghi được volume videolab, giới hạn CPU/RAM/số tiến trình.
  worker-video:
    build:
      context: ./worker-video
    image: vitaminvui-worker-video:8.3
    working_dir: /var/www/backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    environment:
      HOME: /tmp
      APP_NAME: VitaminVui
      APP_ENV: local
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      # R1 — PHẢI khớp prefix Redis của app (config/database.php: slug(APP_NAME).'-database-', .env APP_NAME=VitaminVui);
      # lệch prefix thì worker không thấy queue `video` và webhook đẩy vào hàng đợi không ai đọc.
      REDIS_PREFIX: ${VV_REDIS_PREFIX:-vitaminvui-database-}
      LOG_CHANNEL: stderr
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${VV_DB_DATABASE:-vitaminvui}
      DB_USERNAME: ${VV_DB_USERNAME:-vitaminvui}
      DB_PASSWORD: ${VV_DB_PASSWORD:?Thiếu VV_DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${VV_REDIS_PASSWORD:?Thiếu VV_REDIS_PASSWORD}
      REDIS_DB_SESSION: "1"
      REDIS_CACHE_DB: "2"
      REDIS_QUEUE_DB: "3"
      REDIS_LIMITER_DB: "4"
      CACHE_PREFIX: vitaminvui_cache
      VIDEOLAB_ENABLED: "true"
    volumes:
      - ../backend:/var/www/backend:ro
      - /dev/null:/var/www/backend/.env:ro
      - ../backend/storage/app/videolab:/var/www/backend/storage/app/videolab
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

  scheduler:
    image: vitaminvui-php:8.3
    working_dir: /var/www/backend
    environment:
      HOME: /tmp
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ../backend:/var/www/backend
    env_file:
      - ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vitaminvui

networks:
  vitaminvui:
    driver: bridge
  # T12 — mạng cô lập cho worker video: không ra Internet, chỉ nối MySQL/Redis (ADR-002 §3a.3).
  internal:
    driver: bridge
    internal: true

volumes:
  vitaminvui-mysql:
  vitaminvui-redis:
