name: vitaminvui

# Hạ tầng local T01 — chỉ backend Laravel (agent nextjs-dev chạy frontend/ riêng
# bằng pnpm, KHÔNG cấu hình ở đây; chỉ ghi chú placeholder nếu cần sau này).

services:
  php:
    build:
      context: ./php
      args:
        UID: ${VV_UID:-1000}
        GID: ${VV_GID:-1000}
    image: vitaminvui-php:8.3
    working_dir: /var/www/backend
    environment:
      HOME: /tmp
    volumes:
      - ../backend:/var/www/backend
    env_file:
      - ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vitaminvui

  nginx:
    image: nginx:1.27
    depends_on:
      - php
    volumes:
      - ../backend:/var/www/backend:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    ports:
      # ADR-004 §2.1 (local): http://api.localhost:8000, http://admin-api.localhost:8000.
      # Cổng 8000 publish ra host để frontend (container riêng của nextjs-dev) gọi
      # được qua host.docker.internal:8000.
      - "8000:80"
    networks:
      - vitaminvui

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${VV_DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${VV_DB_DATABASE:-vitaminvui}
      MYSQL_USER: ${VV_DB_USERNAME:-vitaminvui}
      MYSQL_PASSWORD: ${VV_DB_PASSWORD:-secret}
    volumes:
      - vitaminvui-mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${VV_DB_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - vitaminvui

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${VV_REDIS_PASSWORD:-secret}"]
    volumes:
      - vitaminvui-redis:/data
    ports:
      - "6379:6379"
    networks:
      - vitaminvui

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - vitaminvui

  queue:
    image: vitaminvui-php:8.3
    working_dir: /var/www/backend
    environment:
      HOME: /tmp
    command: ["php", "artisan", "queue:work", "--queue=default,exports", "--tries=3", "--sleep=1"]
    volumes:
      - ../backend:/var/www/backend
    env_file:
      - ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vitaminvui

  scheduler:
    image: vitaminvui-php:8.3
    working_dir: /var/www/backend
    environment:
      HOME: /tmp
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ../backend:/var/www/backend
    env_file:
      - ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vitaminvui

networks:
  vitaminvui:
    driver: bridge

volumes:
  vitaminvui-mysql:
  vitaminvui-redis:
