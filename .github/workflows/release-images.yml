# T35-3 (ADR-008 §8.10): build web + admin bản production từ một SHA đã qua CI. Cần người duyệt (Environment production).
# Không deploy: deploy là việc của người vận hành (deploy.sh <sha> trên server).
name: release-images

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA đầy đủ 40 ký tự của commit trên main (image backend của SHA này phải có trên GHCR)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-images
  cancel-in-progress: false

env:
  VV_REGISTRY: ghcr.io/ngocgiangit124

jobs:
  release:
    name: build web + admin production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless; chỉ job này
    env:
      INPUT_SHA: ${{ inputs.sha }}
      VV_ENV: production
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_STATIC_URL: ${{ vars.NEXT_PUBLIC_STATIC_URL }}
      NEXT_PUBLIC_VIDEO_HOSTS: ${{ vars.NEXT_PUBLIC_VIDEO_HOSTS }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_MOMO_HOSTS: ${{ vars.NEXT_PUBLIC_MOMO_HOSTS }}
      NEXT_PUBLIC_ADMIN_API_URL: ${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
      NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
      NEXT_PUBLIC_VIDEO_UPLOAD_URL: ${{ vars.NEXT_PUBLIC_VIDEO_UPLOAD_URL }}
    steps:
      - name: Kiểm định dạng SHA
        run: |
          if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha phải là 40 ký tự hex thường"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: SHA phải nằm trong lịch sử main
        run: |
          # fetch-depth: 0 đã kéo refs/remotes/origin/*; không fetch lại (checkout đã gỡ thông tin xác thực).
          if ! git merge-base --is-ancestor "$INPUT_SHA" refs/remotes/origin/main; then
            echo "::error::SHA không thuộc nhánh main"
            exit 1
          fi
          [ "$(git rev-parse HEAD)" = "$INPUT_SHA" ] || { echo "::error::checkout không khớp SHA"; exit 1; }
      - name: Kiểm vars của Environment
        run: scripts/ci/check-frontend-vars.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image backend của SHA phải đã có (đã qua CI + images)
        run: docker buildx imagetools inspect "$VV_REGISTRY/vitaminvui-backend:$INPUT_SHA" > /dev/null
      - name: Build + push web, admin (tag là production-SHA)
        id: bake2
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          IMAGE_TAG: ${{ inputs.sha }}
          VCS_REF: ${{ inputs.sha }}
        with:
          source: .
          files: frontend/docker-bake.hcl
          targets: web,admin
          push: true
          set: |
            web.cache-from=type=gha,scope=vv-web
            web.cache-to=type=gha,scope=vv-web,mode=max
            admin.cache-from=type=gha,scope=vv-admin
            admin.cache-to=type=gha,scope=vv-admin,mode=max
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Ghi digest (images.lock) vào tóm tắt job
        env:
          META_2: ${{ steps.bake2.outputs.metadata }}
          REQUIRED_TARGETS: web admin
        run: |
          printf '%s' "$META_2" > "$RUNNER_TEMP/meta2.json"
          scripts/ci/collect-digests.sh "$VV_REGISTRY" "$RUNNER_TEMP/meta2.json" > images.lock
          {
            echo "### images.lock (production, commit ${INPUT_SHA})"
            echo '```'
            cat images.lock
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-production.lock
          path: images.lock
          if-no-files-found: error
          retention-days: 90
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Ký image bằng cosign keyless (OIDC GitHub)
        run: |
          grep -q '^# ref ' images.lock || { echo "::error::images.lock không có image nào để ký"; exit 1; }
          grep '^# ref ' images.lock | sed 's/^# ref //' | while read -r ref; do
            cosign sign --yes "$ref"
          done
