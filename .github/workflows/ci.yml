# T35-3 (ADR-008 §8.10). Không deploy từ GitHub. Chạy trên PR và push main.
# Hướng dẫn cấu hình: docs/ops/ci.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Quyền mặc định của token: không có. Mỗi job tự khai báo phần tối thiểu.
permissions: {}

# PR/nhánh: huỷ run cũ. main: xếp hàng, không huỷ run đang build/đẩy image dở.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VV_REGISTRY: ghcr.io/ngocgiangit124
  # Hằng chỉ dùng cho service container của CI (không phải secret thật, không dùng ở đâu khác).
  MYSQL_ROOT_PASSWORD: ci-root-only
  DB_APP_PASSWORD: secret

jobs:
  backend-static:
    name: backend-static (Pint, PHPStan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=-1
      - name: Đường dẫn cache composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Tạo backend/.env (cho larastan khởi động app)
        run: scripts/ci/backend-prepare.sh env
      - name: Pint
        working-directory: backend
        run: vendor/bin/pint --test
      - name: PHPStan
        working-directory: backend
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
      - name: composer audit (chặn khi có advisory)
        working-directory: backend
        run: composer audit --locked --abandoned=report

  backend-test:
    name: backend-test (Pest, không nhóm race)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=-1
      - name: Đường dẫn cache composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Chuẩn bị DB, hosts, .env
        run: scripts/ci/backend-prepare.sh all
      - name: Pest (loại nhóm race)
        working-directory: backend
        run: vendor/bin/pest --exclude-group=race --colors=never

  backend-race:
    name: backend-race (nhóm race, retry 1 lần)
    runs-on: ubuntu-24.04
    needs: backend-test
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=-1
      - name: Đường dẫn cache composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Chuẩn bị DB, hosts, .env
        run: scripts/ci/backend-prepare.sh all
      - name: Pest nhóm race
        working-directory: backend
        run: |
          # Test race nhạy tải runner: cho phép chạy lại đúng 1 lần, ghi cảnh báo để theo dõi độ ổn định.
          if ! vendor/bin/pest --group=race --colors=never; then
            echo "::warning::backend-race lỗi lần 1, chạy lại 1 lần"
            vendor/bin/pest --group=race --colors=never
          fi

  frontend:
    name: frontend (lint, typecheck, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: pnpm 9 (corepack, theo packageManager)
        run: |
          corepack enable
          pnpm --version
      - name: Đường dẫn pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Env local cho test (từ .env.example, giống scripts/cloud-setup.sh)
        run: |
          for app in web admin; do
            [ -f "apps/$app/.env.local" ] || cp "apps/$app/.env.example" "apps/$app/.env.local"
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run lint
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - name: pnpm audit (chặn mức high trở lên, chỉ phụ thuộc production)
        run: pnpm audit --prod --audit-level=high

  images:
    name: images (build + push GHCR, staging)
    # Chỉ sau khi merge vào main và cả 4 job xanh. PR không bao giờ chạy job này.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-static, backend-test, backend-race, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless; chỉ job này
    env:
      IMAGE_TAG: ${{ github.sha }}
      VCS_REF: ${{ github.sha }}
      VV_ENV: staging
      # Công khai theo định nghĩa (nhúng vào bundle). Lấy từ vars của Environment, không phải secrets.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_STATIC_URL: ${{ vars.NEXT_PUBLIC_STATIC_URL }}
      NEXT_PUBLIC_VIDEO_HOSTS: ${{ vars.NEXT_PUBLIC_VIDEO_HOSTS }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_MOMO_HOSTS: ${{ vars.NEXT_PUBLIC_MOMO_HOSTS }}
      NEXT_PUBLIC_ADMIN_API_URL: ${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
      NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
      NEXT_PUBLIC_VIDEO_UPLOAD_URL: ${{ vars.NEXT_PUBLIC_VIDEO_UPLOAD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kiểm vars của Environment
        run: scripts/ci/check-frontend-vars.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push backend (+ worker-video nếu VV_VIDEOLAB=1) (tag là SHA)
        id: bake1
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: infra/production/docker-bake.hcl
          targets: ${{ vars.VV_VIDEOLAB == '1' && 'backend,worker-video' || 'backend' }}
          push: true
          set: |
            php-base.cache-from=type=gha,scope=vv-php-base
            php-base.cache-to=type=gha,scope=vv-php-base,mode=max
            backend.cache-from=type=gha,scope=vv-backend
            backend.cache-to=type=gha,scope=vv-backend,mode=max
            worker-video.cache-from=type=gha,scope=vv-worker-video
            worker-video.cache-to=type=gha,scope=vv-worker-video,mode=max
      - name: Build + push web, admin (tag là staging-SHA)
        id: bake2
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: frontend/docker-bake.hcl
          targets: web,admin
          push: true
          set: |
            web.cache-from=type=gha,scope=vv-web
            web.cache-to=type=gha,scope=vv-web,mode=max
            admin.cache-from=type=gha,scope=vv-admin
            admin.cache-to=type=gha,scope=vv-admin,mode=max
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Ghi digest (images.lock) vào tóm tắt job
        env:
          META_1: ${{ steps.bake1.outputs.metadata }}
          META_2: ${{ steps.bake2.outputs.metadata }}
          # VideoLab tuỳ chọn (PO 2026-10-10): worker-video chỉ bắt buộc khi vars.VV_VIDEOLAB == '1'.
          REQUIRED_TARGETS: ${{ vars.VV_VIDEOLAB == '1' && 'backend worker-video web admin' || 'backend web admin' }}
        run: |
          printf '%s' "$META_1" > "$RUNNER_TEMP/meta1.json"
          printf '%s' "$META_2" > "$RUNNER_TEMP/meta2.json"
          scripts/ci/collect-digests.sh "$VV_REGISTRY" "$RUNNER_TEMP/meta1.json" "$RUNNER_TEMP/meta2.json" > images.lock
          {
            echo "### images.lock (staging, commit ${GITHUB_SHA})"
            echo '```'
            cat images.lock
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-staging.lock
          path: images.lock
          if-no-files-found: error
          retention-days: 90
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Ký image bằng cosign keyless (OIDC GitHub)
        run: |
          grep -q '^# ref ' images.lock || { echo "::error::images.lock không có image nào để ký"; exit 1; }
          grep '^# ref ' images.lock | sed 's/^# ref //' | while read -r ref; do
            cosign sign --yes "$ref"
          done
